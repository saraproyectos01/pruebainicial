<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Proyectos | Laboratorio Web</title>
  <meta name="description" content="Portal central de proyectos web interactivos y experimentos.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(24, 33, 53, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1), transparent 45%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 60px 20px;
      flex: 1;
    }

    /* Header */
    header {
      margin-bottom: 32px;
      text-align: center;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Bar: Search & Filter */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      background: rgba(18, 26, 43, 0.6);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
    }

    .search-input {
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      width: 260px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .category-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active, .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Grid of Cards */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px;
    }

    .project-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-icon {
      font-size: 2.4rem;
      background: rgba(255, 255, 255, 0.04);
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .card-btn:hover {
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      filter: brightness(1.1);
    }

    /* Add Card Placeholder */
    .add-card {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      cursor: pointer;
    }

    .add-card:hover {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.04);
      transform: translateY(-4px);
    }

    .add-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .add-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .add-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }

    footer a {
      color: #93c5fd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-pill">
        <span>🚀</span> <span id="projectCountBadge">1 Proyecto</span>
      </div>
      <h1>Laboratorio de Proyectos</h1>
      <p class="subtitle">Explora y prueba las aplicaciones, juegos y experimentos desarrollados en este espacio.</p>
    </header>

    <!-- Barra de búsqueda y categorías -->
    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar proyecto...">
      <div class="category-chips" id="categoryChips">
        <button class="chip active" data-cat="all">Todos</button>
        <button class="chip" data-cat="Juegos">Juegos</button>
        <button class="chip" data-cat="Educación">Educación</button>
        <button class="chip" data-cat="Herramientas">Herramientas</button>
        <button class="chip" data-cat="Web">Web</button>
      </div>
    </div>

    <!-- Grilla de Tarjetas -->
    <div class="projects-grid" id="projectsGrid">
      <!-- Se genera dinámicamente con JavaScript -->
    </div>
  </div>

  <footer>
    <p>Desplegado en <strong>Vercel</strong> · Repositorio: <a href="https://github.com/saraproyectos01/pruebainicial" target="_blank">pruebainicial</a></p>
  </footer>

  <script>
    // Lista inicial de proyectos (se puede extender fácilmente aquí o vía projects.json)
    const DEFAULT_PROJECTS = [
      {
        id: "logo-tortuga",
        title: "Tortuga LOGO (Aprende a Programar)",
        description: "Juego educativo inspirado en LOGO: dale órdenes a la tortuguita (AVANZA, GIRADERECHA, REPITE), supera 10 niveles y dibuja arte geométrico.",
        category: "Educación",
        icon: "🐢",
        path: "./logo-tortuga/",
        status: "Listo",
        tags: ["Educación", "Programación LOGO", "Canvas 2D", "Web Audio API", "Geometría"],
        date: "Noviembre 2026"
      },
      {
        id: "gusano-game",
        title: "Gusanito Glotón",
        description: "Juego arcade donde el gusano come frutas, crece, tiene animaciones, efectos de sonido y partículas.",
        category: "Juegos",
        icon: "🐛",
        path: "./gusano-game/",
        status: "Listo",
        tags: ["HTML5 Canvas", "Web Audio API", "Arcade", "Móvil"],
        date: "Noviembre 2026"
      },
      {
        id: "aqua-colores",
        title: "Aqua Colores (Gotas Líquidas 8x8)",
        description: "Juego acuático bubble shooter 8x8 con aspecto de agua líquida brillante, fusiones, nombres inventados, screen shake y control por coordenadas A-H / 1-8, texto o voz.",
        category: "Juegos",
        icon: "💧",
        path: "./aqua-colores/",
        status: "Listo",
        tags: ["Bubble Shooter", "Web Audio API", "Web Speech API", "Agua Líquida"],
        date: "Noviembre 2026"
      }
    ];

    let projects = DEFAULT_PROJECTS;
    let activeFilter = 'all';
    let searchQuery = '';

    // Cargar projects.json si está disponible
    async function loadProjects() {
      try {
        const response = await fetch('./projects.json');
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            projects = data;
          }
        }
      } catch (e) {
        // Fallback a DEFAULT_PROJECTS si se abre directamente por file://
      }
      renderProjects();
    }

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      const badge = document.getElementById('projectCountBadge');
      
      const filtered = projects.filter(item => {
        const matchesCategory = activeFilter === 'all' || item.category === activeFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      badge.textContent = `${projects.length} Proyecto${projects.length === 1 ? '' : 's'}`;

      let cardsHtml = filtered.map(p => `
        <article class="project-card">
          <div>
            <div class="card-top">
              <div class="card-icon">${p.icon || '🚀'}</div>
              <span class="status-badge">${p.status || 'Activo'}</span>
            </div>
            <h2 class="card-title">${p.title}</h2>
            <p class="card-desc">${p.description}</p>
            <div class="tag-list">
              ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
          <a href="${p.path}" class="card-btn">
            Abrir Proyecto <span>➔</span>
          </a>
        </article>
      `).join('');

      // Tarjeta informativa para agregar nuevos proyectos
      cardsHtml += `
        <div class="project-card add-card" onclick="showNewProjectInfo()">
          <div class="add-icon">➕</div>
          <h3 class="add-title">Nuevo Proyecto</h3>
          <p class="add-desc">Crea una nueva carpeta con su <code>index.html</code> y regístralo en <code>projects.json</code>.</p>
        </div>
      `;

      grid.innerHTML = cardsHtml;
    }

    function showNewProjectInfo() {
      alert("Para agregar un nuevo proyecto:\\n\\n1. Crea una carpeta en la raíz (ej: /mi-proyecto)\\n2. Agrega sus archivos (index.html, etc.)\\n3. Añade la entrada en 'projects.json'\\n\\n¡Aparecerá aquí automáticamente!");
    }

    // Filtros
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeFilter = chip.dataset.cat;
        renderProjects();
      });
    });

    // Búsqueda
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderProjects();
    });

    loadProjects();
  </script>
</body>
</html>
